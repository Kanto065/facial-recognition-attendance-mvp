<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fav.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Detection System — Admin</title>
    <meta name="description" content="Face detection attendance & zone access admin panel" />
    <meta name="author" content="Face Detection System" />

    <meta property="og:title" content="Face Detection System — Admin" />
    <meta property="og:description" content="Face detection attendance & zone access admin panel" />
    <meta property="og:type" content="website" />

    <script>
      // Applied before React mounts so the page never flashes light-then-dark (or vice versa)
      // on load - keep this logic in sync with ThemeContext.tsx's getInitialTheme().
      (function () {
        var stored = localStorage.getItem('admin-theme');
        var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
